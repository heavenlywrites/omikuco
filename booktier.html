      <div class="card"><div class="label">Club team</div>${[...c.admins.map(id=>[id,'Admin']),...c.mods.map(id=>[id,'Mod'])].map(([id,r])=>{const u=user(id);return u?`<div class="row" style="padding:5px 0">${avatar(u,'sm')}<span style="flex:1">${esc(u.display)} <span style="color:var(--muted)">@${esc(u.username)}</span></span><span class="tag">${r}</span></div>`:''}).join('')||'<p style="color:var(--muted);font-size:14px;margin:0">No admins or mods assigned yet.</p>'}
      <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">Only the site owner can add or remove admins and mods.</p></div>`}
  return `<div class="h2">Manage clubs</div><p class="lead">Review applications and look after your ${cs.length>1?'clubs':'club'}. Clubs are for readers 18 and over; applicants aren’t told this, so check the age answer.</p>
  <div class="chips">${cs.map(x=>{const mm=clubMeta(x.id),p=DB.apps.filter(a=>a.club===x.id&&a.status==='pending').length;return`<button class="chip ${x.id===c.id?'on':''}" onclick="manageClub='${x.id}';renderView()"><span class="clubdot" style="--c:${mm.c}"></span>${mm.name}${p?` · ${p}`:''}</button>`}).join('')}</div>
  <div class="mgrid"><div class="mstat"><div class="n">${cnt('pending')}</div><div class="l">Waiting for review</div></div><div class="mstat"><div class="n">${ids.length}</div><div class="l">Members</div></div><div class="mstat"><div class="n">${cnt('declined')}</div><div class="l">Declined all time</div></div></div>
  <div class="tabs">${[['pending',`Pending (${cnt('pending')})`],['accepted','Accepted'],['declined','Declined'],['members','Members'],...(admin?[['club','Club settings']]:[])].map(([k,v])=>`<button class="${manageTab===k?'on':''}" onclick="manageTab='${k}';renderView()">${v}</button>`).join('')}</div>
  ${body}`}
function appCard(a){const u=user(a.user)||{display:'Deleted user',username:'—'},qs=QUESTIONS(clubMeta(a.club)),age=parseInt(a.answers[0],10);
  const prev=DB.apps.filter(x=>x.user===a.user&&x.club===a.club&&x.id!==a.id&&x.date<a.date).sort((x,y)=>y.date-x.date);
  const prevDec=prev.filter(x=>x.status==='declined');const rev=a.reviewer&&user(a.reviewer);
  return `<div class="card" style="margin-top:14px"><div class="row" style="flex-wrap:wrap">${avatar(u)}<div style="flex:1;min-width:140px"><b style="font-weight:500;cursor:pointer" onclick="go('profile:${u.id}')">${esc(u.display)}</b> <span style="color:var(--muted);font-size:13px">@${esc(u.username)}</span><div style="font-size:12.5px;color:var(--muted)">Applied ${fmtD(a.date)}</div></div>
    ${age<18?`<span class="tag red">Age ${age} · under 18</span>`:`<span class="tag">Age ${age}</span>`}
    ${prevDec.length?`<span class="tag amber">Declined before ×${prevDec.length}</span>`:''}
    ${a.status!=='pending'?`<span class="tag ${a.status==='accepted'?'green':'red'}">${a.status==='accepted'?'Accepted':'Declined'}</span>`:''}</div>
  ${qs.slice(1).map((q,i)=>`<div class="app-q"><div class="q">${i+2}. ${esc(q.q)}</div><div class="a">${esc(a.answers[i+1])}</div></div>`).join('')}
  ${a.status!=='pending'?`<div class="hist">${a.status==='accepted'?'Accepted':'Declined'} by ${rev?esc(rev.display):'—'} on ${fmtD(a.reviewed)}${a.note?`. Note: “${esc(a.note)}”`:''}</div>`:''}
  ${prev.length?`<details class="hist"><summary style="cursor:pointer">Previous applications (${prev.length})</summary>${prev.map(p=>`<div style="margin-top:10px"><span class="tag ${p.status==='declined'?'red':p.status==='accepted'?'green':''}">${p.status}</span> ${fmtD(p.date)}${p.reviewer&&user(p.reviewer)?` · by ${esc(user(p.reviewer).display)}`:''}${p.note?` · “${esc(p.note)}”`:''}
    ${p.answers.slice(1).map((x,i)=>`<div class="app-q"><div class="q">${i+2}. ${esc(qs[i+1].q)}</div><div class="a">${esc(x)}</div></div>`).join('')}</div>`).join('')}</details>`:''}
  ${a.status==='pending'?`<div class="f" style="margin-top:12px"><input id="note-${a.id}" placeholder="Private note for the team (optional)"></div><div class="btns" style="margin-top:10px"><button class="b pri" onclick="review('${a.id}','accepted')">Accept</button><button class="b danger" onclick="review('${a.id}','declined')">Decline</button></div>`:''}</div>`}
function review(id,st){const a=DB.apps.find(x=>x.id===id),c=club(a.club);
  if(st==='accepted'&&parseInt(a.answers[0],10)<18&&!sure('minor'+id))return toast('Applicant is under 18. Tap Accept again to confirm');
  a.status=st;a.reviewer=me.id;a.reviewed=Date.now();a.note=$('#note-'+id)?.value.trim()||'';
  if(st==='accepted'&&!c.members.includes(a.user)){c.members.push(a.user);c.joined=c.joined||{};c.joined[a.user]=Date.now()}
  save();renderSide();renderView();toast(st==='accepted'?'Accepted':'Declined')}
function removeMember(cid,id){if(!sure('rm'+id))return;const c=club(cid);c.members=c.members.filter(x=>x!==id);save();renderView();toast('Removed from club')}

function vOwner(){if(!isOwner(me))return redirect('home');setTitle('Owner tools');
  const q=ownerQ.trim().toLowerCase().replace(/^@/,'');

  <div class="mgrid">${['admins','mods'].map(k=>`<div class="mstat"><div class="n">${new Set(DB.clubs.flatMap(c=>c[k])).size}</div><div class="l">${k==='admins'?'Club admins':'Club mods'}</div></div>`).join('')}<div class="mstat"><div class="n">${DB.users.length}</div><div class="l">Accounts</div></div></div>
  <div class="search">${I.people}<input id="oq" placeholder="Search by username, name or email" value="${esc(ownerQ)}" data-live="ownerQ"></div>
  ${l.map(u=>`<div class="card" style="margin-top:12px"><div class="row">${avatar(u)}<div style="flex:1;min-width:0"><b style="font-weight:500">${esc(u.display)}</b> <span style="color:var(--muted);font-size:13px">@${esc(u.username)}</span><div style="font-size:12.5px;color:var(--muted)">${esc(u.email)} · joined ${fmtD(u.created)}</div></div>${isOwner(u)?'<span class="tag gt">Owner</span>':''}</div>

function setRole(uid_,cid,r){const c=club(cid);['members','mods','admins'].forEach(k=>c[k]=c[k].filter(x=>x!==uid_));
  if(r!=='none'){c.members.push(uid_);c.joined=c.joined||{};c.joined[uid_]=c.joined[uid_]||Date.now()}
  if(r==='mod')c.mods.push(uid_);if(r==='admin')c.admins.push(uid_);
  save();renderSide();toast(`${user(uid_).display}: ${r==='none'?'removed from':r==='member'?'member of':r+' of'} ${clubMeta(cid).name}`)}

let cTab='fav',cSpoil=false,awaiting=null,cBook=null;
function renderComposer(){const el=$('#composer'),v=view.split(':'),S=L();
  const show=(v[0]==='dm'&&!hidden(v[1])&&frStatus(v[1])==='friends'&&!editingMsg)||v[0]==='book'||(v[0]==='club'&&v[2]==='chat'&&isMember(me,club(v[1])))||(v[0]==='home'&&S.books.length);
  if(!show){el.innerHTML='';el.style.display='none';return}el.style.display='';
  if(v[0]==='dm'){el.innerHTML=`<div class="cbox"><textarea id="q" rows="1" placeholder="Message ${esc(user(v[1]).display)}…"></textarea><div class="ctl"><button class="send" id="sendBtn" disabled>${I.up}</button></div></div>`;wireComposer(()=>sendDM(v[1]));return}
  if(v[0]==='club'){el.innerHTML=`<div class="cbox"><textarea id="q" rows="1" placeholder="Message the ${clubMeta(v[1]).name} club…"></textarea><div class="ctl"><button class="send" id="sendBtn" disabled>${I.up}</button></div></div>`;wireComposer(()=>sendChat(v[1]));return}
  if(v[0]==='book')cBook=v[1];if(!book(cBook))cBook=(S.books.find(b=>b.status==='reading')||S.books[0]||{}).id;
  el.innerHTML=`<div class="cbox"><textarea id="q" rows="1" placeholder="${awaiting?'Your margin note on that line…':'Add a line worth keeping…'}"></textarea><div class="ctl">
    ${awaiting?`<button class="skip" onclick="awaiting=null;renderComposer()">Skip</button>`:`
    ${v[0]!=='book'?`<label class="sel"><span>${esc(book(cBook)?.title||'')}</span><select onchange="cBook=this.value;renderComposer()">${S.books.map(b=>`<option value="${b.id}" ${b.id===cBook?'selected':''}>${esc(b.title)}</option>`).join('')}</select></label>`:''}
    <input class="pg" id="pg" inputmode="numeric" placeholder="p.">
    <div style="position:relative"><button class="tg" id="tagBtn" title="Tab"><span class="dot" style="--c:${tab(cTab).c};width:10px;height:10px"></span></button><div class="tagpop" id="tagPop" hidden></div></div>
    <button class="tg ${cSpoil?'on':''}" title="Spoiler" onclick="cSpoil=!cSpoil;renderComposer();toast(cSpoil?'Spoiler on':'Spoiler off')">${I.eye}</button>`}
    <button class="send" id="sendBtn" disabled>${I.up}</button></div></div>`;
  wireComposer(sendNote);
  const tb=$('#tagBtn');if(tb)tb.onclick=e=>{e.stopPropagation();const p=$('#tagPop');p.hidden=!p.hidden;p.innerHTML=TABS.map(t=>`<button class="${t.id===cTab?'on':''}" onclick="cTab='${t.id}';renderComposer()"><span class="dot" style="--c:${t.c}"></span>${t.name}</button>`).join('')};
}
document.addEventListener('click',e=>{const p=$('#tagPop');if(p&&!e.target.closest('#tagPop,#tagBtn'))p.hidden=true});
function wireComposer(fn){const ta=$('#q'),sb=$('#sendBtn');
  ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(180,ta.scrollHeight)+'px';sb.disabled=!ta.value.trim()};
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();fn()}};sb.onclick=fn}
function sendChat(cid){const t=$('#q').value.trim();if(!t)return;DB.msgs.push({id:uid(),club:cid,user:me.id,text:t.slice(0,1500),date:Date.now()});save();renderView();renderComposer();$('#q').focus();$('#scroll').scrollTop=$('#scroll').scrollHeight}
function sendNote(){const S=L(),t=$('#q').value.trim();if(!t)return;
  if(awaiting){const n=S.notes.find(x=>x.id===awaiting);if(n)n.thought=t;awaiting=null}
  else{if(!cBook)return openAddBook();const n={id:uid(),book:cBook,text:t,page:+($('#pg')?.value)||'',tab:cTab,thought:'',spoiler:cSpoil,date:today(),fav:false};S.notes.push(n);awaiting=n.id;cSpoil=false;if(!view.startsWith('book:'))view='book:'+cBook}
  save();renderAll();setTimeout(()=>$('#scroll').scrollTo({top:$('#scroll').scrollHeight,behavior:'smooth'}),30);$('#q').focus()}

/* =========================================================
   MODALS: books, progress, timer, notes, settings
   ========================================================= */
function modal(h){$('#modal').innerHTML=`<button class="ib x" onclick="closeModal()">${I.x}</button>`+h;$('#scrim').classList.add('on');$('#modal').scrollTop=0}
function closeModal(){$('#scrim').classList.remove('on');stopTimer()}
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
let pend={};const sure=k=>{if(pend[k]){delete pend[k];return true}pend[k]=1;toast('Tap again to confirm');setTimeout(()=>delete pend[k],2500);return false};

let found={matches:[],author:[]},chosen=null,searchId=0,addTarget=null;
const skels=n=>Array(n).fill('<div class="skel"></div>').join('');
const pickCard=(x,i,row)=>`<button class="pick" onclick="choose('${row}',${i},this)"><div class="cover"><div class="fb">${sigil(x.title+x.author)}</div>${coverImg(x.thumb)}</div><b>${esc(x.title)}</b><span>${esc(x.author)}${x.year?' · '+x.year:''}</span></button>`;
function openAddBook(target){toggleSide(false);chosen=null;addTarget=target||null;
  modal(`<h3>${addTarget?'Choose the club’s book':'Add a book'}</h3><div class="sub">Type a title or an author. Scroll the covers and tap the right one.</div>
  <div class="search">${I.people}<input id="olq" placeholder="Title or author" autocomplete="off"></div><div id="res"></div><div id="pickArea"></div>`);
  setTimeout(()=>$('#olq').focus(),50);let t;
  $('#olq').oninput=e=>{clearTimeout(t);const q=e.target.value.trim();if(q.length<2){$('#res').innerHTML='';return}
    $('#res').innerHTML=`<div class="rowh">Searching…</div><div class="carousel">${skels(5)}</div>`;t=setTimeout(()=>runSearch(q),380)}}
async function runSearch(q){const my=++searchId;netFail=false;found={matches:[],author:[],authorDone:false};
  const [ol,gb]=await Promise.all([olSearch('q='+encodeURIComponent(q),20),gbSearch(q,24)]);if(my!==searchId)return;
  found.matches=merge(ol,gb).slice(0,24);
  const counts={};found.matches.forEach(x=>counts[x.author]=(counts[x.author]||0)+1);const qa=norm(q);
  const top=Object.keys(counts).find(a=>a!=='Unknown'&&qa.includes(norm(a).split(' ').pop()))||Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0];
  drawResults(top);
  if(top&&top!=='Unknown'){const [oa,ga]=await Promise.all([olSearch('author='+encodeURIComponent(top)+'&sort=editions',24),gbSearch('inauthor:"'+top+'"',30)]);if(my!==searchId)return;
    const have=new Set(found.matches.map(x=>norm(x.title)));found.author=merge(oa,ga).filter(x=>!have.has(norm(x.title))).slice(0,24);found.authorDone=true;drawResults(top)}}
function drawResults(top){const m=found.matches,a=found.author;
  $('#res').innerHTML=(m.length?`<div class="rowh"><span>Closest matches</span><span style="color:var(--muted)">${m.length} found →</span></div><div class="carousel">${m.map((x,i)=>pickCard(x,i,'matches')).join('')}</div>`
    :`<div class="sub" style="margin-top:16px;color:var(--soft)">${netFail?'Search is blocked in this preview. Open Booktier in Safari or Chrome and every real book will come up with its cover.':'No covers found. Try another spelling.'}</div>`)
  +(m.length&&top&&top!=='Unknown'?`<div class="rowh"><span>More by ${esc(top)}</span>${a.length?`<span style="color:var(--muted)">${a.length} →</span>`:''}</div><div class="carousel">${a.length?a.map((x,i)=>pickCard(x,i,'author')).join(''):found.authorDone?'<div class="sub">Nothing else found.</div>':skels(4)}</div>`:'')}
function choose(row,i,el){chosen=found[row][i];document.querySelectorAll('.pick').forEach(p=>p.classList.remove('sel'));el.classList.add('sel');
  $('#pickArea').innerHTML=addForm();$('#pickArea').scrollIntoView({behavior:'smooth',block:'nearest'})}
let newRating=0;
function starPick(){return `<div class="stars" id="newStars">${[1,2,3,4,5].map(i=>`<button type="button" class="${i<=newRating?'on':''}" onclick="newRating=${i};document.querySelectorAll('#newStars button').forEach((b,j)=>b.classList.toggle('on',j<${i}));$('#rateLbl').textContent=['','Didn’t like it','It was okay','Liked it','Really liked it','Loved it'][${i}];$('#addBtn').disabled=false">${I.star}</button>`).join('')}<span id="rateLbl" style="align-self:center;margin-left:8px;font-size:13px;color:var(--soft)">${newRating?['','Didn’t like it','It was okay','Liked it','Really liked it','Loved it'][newRating]:''}</span></div>`}
function addForm(){newRating=0;return `<div class="chosen"><div class="cover"><div class="fb">${sigil(chosen.title)}</div>${coverImg(chosen.img)}</div><div><b style="font-weight:500;font-size:16px;display:block">${esc(chosen.title)}</b><span style="color:var(--soft);font-size:13px">${esc(chosen.author)}${chosen.year?' · '+chosen.year:''}${chosen.pages?' · '+chosen.pages+' pages':''}</span></div></div>
  ${addTarget?'':`<div class="f"><label>Shelf</label></div><div class="seg" id="addseg" style="margin-top:0">${Object.entries(STATUS).map(([k,v],j)=>`<button data-k="${k}" class="${j===0?'on':''}" onclick="document.querySelectorAll('#addseg button').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${v}</button>`).join('')}</div>
  <div class="f"><label>Your rating <span style="color:var(--red)">*</span></label>${starPick()}<label>Review <span style="color:var(--muted)">(optional)</span></label><textarea id="newReview" placeholder="What did you think? Friends and visitors will see this on your shelf."></textarea></div>`}
  <div class="btns"><button class="b pri right" id="addBtn" ${addTarget?'':'disabled'} onclick="confirmAdd()">${addTarget?'Set as current read':'Add to shelf'}</button></div>`}
function confirmAdd(){const c=chosen;
  if(addTarget){const cl=club(addTarget.split(':')[1]);cl.current={title:c.title,author:c.author,img:c.img};save();closeModal();renderView();toast('Current read updated');return}
  if(!newRating)return toast('Rate the book out of 5 to add it');
  const st=$('#addseg .on').dataset.k,S=L();
  const b={id:uid(),title:c.title,author:c.author,pages:c.pages||300,page:st==='done'?(c.pages||300):0,status:st,rating:newRating,img:c.img,added:today(),finished:st==='done'?today():null,review:($('#newReview')?.value||'').trim().slice(0,2000)};
  S.books.unshift(b);save();closeModal();go('book:'+b.id);toast('Added to '+STATUS[st])}
async function openCoverPicker(id){const b=book(id);
  modal(`<h3>Choose a cover</h3><div class="sub">Editions of <i>${esc(b.title)}</i>. Tap one to use it.</div><div class="carousel" id="cvs">${skels(5)}</div>`);
  const [ol,gb]=await Promise.all([olSearch(`title=${encodeURIComponent(b.title)}&author=${encodeURIComponent(b.author)}`,10),gbSearch(`intitle:${b.title} inauthor:${b.author}`,30)]);
  window._cv=[...ol,...gb].filter((x,i,a)=>a.findIndex(y=>y.img===x.img)===i);
  $('#cvs').innerHTML=_cv.map((x,i)=>`<button class="pick ${x.img===b.img?'sel':''}" onclick="book('${id}').img=_cv[${i}].img;save();closeModal();renderAll();toast('Cover updated')"><div class="cover"><div class="fb">${sigil(x.title)}</div>${coverImg(x.thumb)}</div><span>${esc(x.year||'')}</span></button>`).join('')||`<div class="sub">${netFail?'Covers can’t load in this preview. Open Booktier in a browser.':'No other covers found.'}</div>`}
function openEditBook(id){const b=book(id);
  modal(`<h3>Edit book</h3><div class="sub">${esc(b.title)} · ${esc(b.author)}</div>
  <div class="seg" id="seg">${Object.entries(STATUS).map(([k,v])=>`<button data-k="${k}" class="${b.status===k?'on':''}" onclick="document.querySelectorAll('#seg button').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${v}</button>`).join('')}</div>
  <div class="f"><label>Total pages</label><input id="ep" inputmode="numeric" value="${b.pages}"><label>Review</label><textarea id="er" placeholder="Final thoughts…">${esc(b.review)}</textarea></div>
  <div class="btns"><button class="b" onclick="openCoverPicker('${id}')">Change cover</button><button class="b danger" onclick="delBook('${id}')">Delete</button><button class="b pri right" onclick="saveBook('${id}')">Save</button></div>`)}
function saveBook(id){const b=book(id),st=$('#seg .on').dataset.k;if(st==='done'&&b.status!=='done'){b.finished=today();b.page=+$('#ep').value||b.pages}
  Object.assign(b,{status:st,pages:+$('#ep').value||b.pages,review:$('#er').value.trim()});save();closeModal();renderAll();toast('Saved')}
function delBook(id){if(!sure('b'+id))return;const S=L();S.books=S.books.filter(b=>b.id!==id);S.notes=S.notes.filter(n=>n.book!==id);save();closeModal();go('home')}
function openRate(id){const b=book(id);
  modal(`<h3>Rate it</h3><div class="sub">${esc(b.title)}</div><div class="stars">${[1,2,3,4,5].map(i=>`<button class="${i<=b.rating?'on':''}" onclick="book('${id}').rating=${i};save();openRate('${id}');renderAll()">${I.star}</button>`).join('')}</div>
  <div class="f"><label>Review</label><textarea id="rr" placeholder="A sentence or two for future you">${esc(b.review)}</textarea></div>
  <div class="btns"><button class="b pri right" onclick="book('${id}').review=$('#rr').value.trim();save();closeModal();renderAll()">Done</button></div>`)}
function openProgress(id){const S=L();id=id||(S.books.find(b=>b.status==='reading')||{}).id;if(!id)return openAddBook();const b=book(id);
  modal(`<h3>Update progress</h3><div class="f"><select onchange="openProgress(this.value)">${S.books.filter(x=>x.status!=='done').map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.title)}</option>`).join('')}</select>
  <label>Page (of ${b.pages})</label><input id="pp" inputmode="numeric" value="${b.page}"><input type="range" id="pr" min="0" max="${b.pages}" value="${b.page}" style="padding:0;border:0;margin-top:14px;accent-color:var(--gt)"></div>
  <div class="btns"><button class="b" onclick="closeModal()">Cancel</button><button class="b pri right" onclick="saveProgress('${id}',$('#pp').value)">Save</button></div>`);
  $('#pr').oninput=e=>$('#pp').value=e.target.value;$('#pp').oninput=e=>$('#pr').value=e.target.value}
function saveProgress(id,val){const S=L(),b=book(id),p=Math.max(0,Math.min(b.pages,+val||0)),d=p-b.page;
  if(d>0)S.log[today()]=(S.log[today()]||0)+d;b.page=p;if(b.status==='tbr')b.status='reading';
  if(p>=b.pages&&b.status!=='done'){b.status='done';b.finished=today();save();closeModal();renderAll();return openRate(id)}
  save();closeModal();renderAll();toast(d>0?`${d} pages logged`:'Progress saved')}
let tInt=null,tAcc=0,tStart=0,tBook=null;
function openTimer(id){const S=L();tBook=id||(S.books.find(b=>b.status==='reading')||{}).id;if(!tBook)return openAddBook();tAcc=0;
  modal(`<h3 style="text-align:center">Reading session</h3><div class="f"><select onchange="tBook=this.value">${S.books.filter(b=>b.status!=='done').map(b=>`<option value="${b.id}" ${b.id===tBook?'selected':''}>${esc(b.title)}</option>`).join('')}</select></div>
  <div class="timer" id="tm">00:00</div><div class="sub" style="text-align:center">Phone face down.</div>
  <div class="btns" style="justify-content:center"><button class="b pri" id="tgo" onclick="toggleTimer()" style="min-width:140px">Start</button></div>
  <div id="tend" hidden class="f"><label>Stopped on page</label><input id="tp" inputmode="numeric"><div class="btns"><button class="b pri right" onclick="endTimer()">Save session</button></div></div>`)}
function toggleTimer(){if(tInt){tAcc+=Date.now()-tStart;stopTimer();$('#tgo').textContent='Resume';$('#tend').hidden=false;$('#tp').value=book(tBook).page;return}
  tStart=Date.now();$('#tgo').textContent='Pause';$('#tend').hidden=true;
  tInt=setInterval(()=>{const s=Math.floor((tAcc+Date.now()-tStart)/1000);$('#tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250)}
function stopTimer(){clearInterval(tInt);tInt=null}
function endTimer(){const m=Math.max(1,Math.round(tAcc/60000)),S=L();S.minutes[today()]=(S.minutes[today()]||0)+m;saveProgress(tBook,$('#tp').value);toast(`${m} min logged`)}
function openEditNote(id){const n=L().notes.find(x=>x.id===id);
  modal(`<h3>Edit highlight</h3><div class="f"><label>Line</label><textarea id="xt">${esc(n.text)}</textarea><label>Your note</label><textarea id="xn">${esc(n.thought)}</textarea>
  <div style="display:flex;gap:10px"><div style="flex:1"><label>Page</label><input id="xp" inputmode="numeric" value="${n.page}"></div><div style="flex:2"><label>Tab</label><select id="xg">${TABS.map(t=>`<option value="${t.id}" ${t.id===n.tab?'selected':''}>${t.name}</option>`).join('')}</select></div></div>
  <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="xs" ${n.spoiler?'checked':''} style="width:auto;accent-color:var(--gt)"> Hide as spoiler</label></div>
  <div class="btns"><button class="b danger" onclick="delNote('${id}')">Delete</button><button class="b pri right" onclick="saveNote('${id}')">Save</button></div>`)}
function saveNote(id){const n=L().notes.find(x=>x.id===id);Object.assign(n,{text:$('#xt').value.trim()||n.text,thought:$('#xn').value.trim(),page:+$('#xp').value||'',tab:$('#xg').value,spoiler:$('#xs').checked});save();closeModal();renderAll()}
function delNote(id){if(!sure('n'+id))return;const S=L();S.notes=S.notes.filter(n=>n.id!==id);if(awaiting===id)awaiting=null;save();closeModal();renderAll()}
function fav(id){const n=L().notes.find(x=>x.id===id);n.fav=!n.fav;save();renderView()}
function copyNote(id){const n=L().notes.find(x=>x.id===id),b=book(n.book);(navigator.clipboard?navigator.clipboard.writeText(`“${n.text}”\n— ${b.author}, ${b.title}`):Promise.reject()).then(()=>toast('Copied'),()=>toast('Copy isn’t available here'))}
function openGoal(){modal(`<h3>Yearly goal</h3><div class="f"><label>Books this year</label><input id="gg" inputmode="numeric" value="${L().goal}"></div><div class="btns"><button class="b pri right" onclick="L().goal=Math.max(1,+$('#gg').value||1);save();closeModal();renderAll()">Save</button></div>`)}

/* settings: Profile tab (how you appear) + Account tab (email, password, sign-in) */
let setTab='profile';
const segRow=(on,a,b,fa,fb)=>`<div class="seg" style="margin-top:0"><button class="${on?'':'on'}" onclick="${fa}">${a}</button><button class="${on?'on':''}" onclick="${fb}">${b}</button></div>`;
const note=t=>`<div style="font-size:12.5px;color:var(--muted);margin-top:6px">${t}</div>`;
const sh=t=>`<div class="label" style="margin-top:22px">${t}</div>`;
function openSettings(tab){toggleSide(false);if(tab)setTab=tab;
  const tabs=`<div class="tabs" style="margin:6px 0 4px">${[['profile','Profile'],['account','Account'],['help','Help']].map(([k,v])=>`<button class="${setTab===k?'on':''}" onclick="openSettings('${k}')">${v}</button>`).join('')}</div>`;
  let body='';
  if(setTab==='profile'){const vc=viewCount(me.id);
    body=`<div class="f"><label>Display name</label><input id="ep_d" value="${esc(me.display)}" maxlength="40">
      <label>Username</label><input id="ep_u" value="${esc(me.username)}" ${NOCAP} oninput="this.value=cleanUser(this.value)"><div class="help">Others find you by @username. It must be unique.</div>
      <label>Bio</label><textarea id="ep_b" maxlength="300" placeholder="What do you love to read?">${esc(me.bio)}</textarea><div class="err" id="ep_err"></div>
      <div class="btns" style="margin-top:10px"><button class="b pri" onclick="saveProfile()">Save profile</button><button class="b" onclick="closeModal();go('profile:'+me.id)">View my profile</button></div></div>
    ${sh('Profile views')}
    <div class="row" style="background:var(--mist);border-radius:8px;padding:12px 14px;gap:22px;flex-wrap:wrap"><div><div style="font-size:24px;font-weight:300">${vc.toLocaleString()}</div><div style="font-size:12px;color:var(--muted)">All time</div></div><div><div style="font-size:24px;font-weight:300">${viewsSince(me.id,7)}</div><div style="font-size:12px;color:var(--muted)">Last 7 days</div></div><div><div style="font-size:24px;font-weight:300">${viewsSince(me.id,30)}</div><div style="font-size:12px;color:var(--muted)">Last 30 days</div></div></div>
    <div style="margin-top:10px">${segRow(!me.hideViews,'Hidden on my profile','Shown on my profile','setHideViews(true)','setHideViews(false)')}</div>
    ${note(me.hideViews?'Visitors can’t see your view count. You can always see it here.':'Everyone who can see your profile sees your view count.')}
    ${sh('Sleep status')}${segRow(!!me.showStatusTime,'Just sleeping or awake','Also show the time','setPref(\'showStatusTime\',false)','setPref(\'showStatusTime\',true)')}
    ${note(me.showStatusTime?'Your profile shows when you went to sleep or woke up, like “Sleeping since 11:02 PM”.':'Your profile only shows “Sleeping” or “Awake”, not the time.')}
    ${sh('Read receipts')}${segRow(rrOn(me),'Off','On','setPref(\'readReceipts\',false)','setPref(\'readReceipts\',true)')}
    ${note(rrOn(me)?'Friends can see when you’ve read their messages, and you can see when they’ve read yours (if theirs are on too).':'Friends won’t see when you’ve read their messages. To keep it fair, you won’t see their read receipts either.')}
    ${sh('Who can see your profile')}${segRow(me.public,'Private · friends only','Public · everyone','setPublic(false)','setPublic(true)')}
    ${note(me.public?'Anyone on Booktier can see your profile posts, bookshelf, ratings and reviews.':'Only friends can see your profile posts, bookshelf, ratings and reviews.')}
    ${sh('Accent color')}<div class="swatches">${ACCENTS.map(c=>`<button class="sw ${me.accent===c?'on':''}" style="--c:${c}" onclick="setAccent('${c}')"></button>`).join('')}
      <label class="sw" style="--c:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);background:var(--c);position:relative;cursor:pointer" title="Custom"><input type="color" value="${me.accent}" onchange="setAccent(this.value)" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label></div>
    ${sh('Bookshelf wood')}<div class="woods">${WOODS.map(w=>`<button class="wood ${(me.wood||'walnut')===w.id?'on':''}" onclick="setWood('${w.id}')"><i style="background:repeating-linear-gradient(90deg,${w.v[4]} 0 3px,${w.v[5]} 3px 9px,${w.v[6]} 9px 11px,${w.v[5]} 11px 19px);border-bottom:7px solid ${w.v[8]}"></i>${w.name}</button>`).join('')}</div>`;
  }else if(setTab==='help'){
    body=`<div style="text-align:center;padding:26px 6px 6px">
      <div style="width:56px;height:56px;border-radius:14px;background:#5865F2;display:grid;place-items:center;margin:0 auto 14px"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5c3-1.3 7-1.3 10 0M7 16.5c3 1.3 7 1.3 10 0M6.2 7.8C4.7 10 4 12.6 4.2 15.6c1.3 1 2.6 1.7 4 2.1l.9-1.6M17.8 7.8c1.5 2.2 2.2 4.8 2 7.8-1.3 1-2.6 1.7-4 2.1l-.9-1.6"/><circle cx="9.3" cy="12.6" r="1.1"/><circle cx="14.7" cy="12.6" r="1.1"/></svg></div>
      <div style="font-size:19px;font-weight:400">Need help?</div>
      <p style="font-size:14.5px;color:var(--soft);line-height:1.55;margin:8px auto 18px;max-width:380px">Join the Booktier Discord server to get help. Ask a question, report a bug, or reach the team and club admins.</p>
      <a class="b pri" href="${DISCORD_URL}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Join the Discord server</a>
      <div style="font-size:12px;color:var(--muted);margin-top:12px;word-break:break-all">${esc(DISCORD_URL)}</div></div>`;
  }else{
    body=`${sh('Email')}<div class="row" style="background:var(--mist);border-radius:8px;padding:12px 14px"><div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(me.email)}</div><button class="b sm" onclick="emailStart()">Change</button></div><div id="emArea"></div>
    ${sh('Password')}<div id="pwArea"><p style="font-size:14px;color:var(--soft);margin:0 0 12px">To change your password we’ll email a code to ${esc(mask(me.email))}.</p><button class="b pri" onclick="pwSend()">Send code</button></div>
    ${sh('Two-step sign-in')}${segRow(me.twofa,'Off','On · email code','setTwoFA(false)','setTwoFA(true)')}
    ${note(me.twofa?'Every time you sign in, we’ll email you a code to enter after your password.':'You sign in once with your email and password, and stay signed in on this device.')}
    ${sh('Blocked accounts')}${DB.blocks.filter(x=>x.by===me.id).map(x=>{const u=user(x.who);return u?`<div class="urow">${avatar(u,'sm')}<div class="info"><b>${esc(u.display)}</b><span>@${esc(u.username)} · blocked ${fmtD(x.date)}</span></div><button class="b sm" onclick="unblock('${u.id}')">Unblock</button></div>`:''}).join('')||note('You haven’t blocked anyone.')}
    ${sh('Session')}<button class="b" onclick="logout()">Log out</button>`;
  }
  modal(`<h3>Settings</h3><div class="sub" style="margin-bottom:0">@${esc(me.username)}</div>${tabs}${body}`)}
function setPref(k,v){me[k]=v;save();openSettings('profile');renderView()}
function setHideViews(v){me.hideViews=v;save();openSettings('profile');if(view.startsWith('profile:'))renderView()}
/* change email: verify with a code sent to the CURRENT email, then set the new one */
function emailStart(){const code=sendCode(me.email);
  $('#emArea').innerHTML=`<p style="font-size:14px;color:var(--soft);margin:12px 0 0">To change your email, enter the code we sent to your current email, ${esc(mask(me.email))}.</p>${inboxHTML(me.email,code)}
  <div class="f"><label>Code from your current email</label><input id="oe_c" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div class="err" id="oe_err"></div></div>
  <div class="btns" style="margin-top:10px"><button class="b pri" onclick="emailCheckOld()">Verify</button><button class="b" onclick="emailStart()">Send a new code</button><button class="b" onclick="$('#emArea').innerHTML=''">Cancel</button></div>`;$('#oe_c').focus()}
function emailCheckOld(){const rec=DB.codes[me.email],c=$('#oe_c').value.trim();
  if(!rec||rec.exp<Date.now())return $('#oe_err').textContent='That code expired. Send a new one.';
  if(c!==rec.code)return $('#oe_err').textContent='That code isn’t right.';
  delete DB.codes[me.email];save();
  $('#emArea').innerHTML=`<p style="font-size:14px;color:#2F6B55;margin:12px 0 0">Verified ✓ Now enter your new email.</p>
  <div class="f"><label>New email</label><input id="ne" type="email" inputmode="email" ${NOCAP}><div class="err" id="ne_err"></div></div>
  <div class="btns" style="margin-top:10px"><button class="b pri" onclick="emailSave()">Save new email</button><button class="b" onclick="$('#emArea').innerHTML=''">Cancel</button></div>`;$('#ne').focus()}
function emailSave(){const e=$('#ne').value.trim().toLowerCase(),err=$('#ne_err');
  if(!emailOK(e))return err.textContent='Enter a valid email.';
  if(e===me.email)return err.textContent='That’s already your email.';
  if(DB.users.some(x=>x.email===e))return err.textContent='Another account already uses that email.';
  me.email=e;save();openSettings('account');toast('Email updated. Use '+e+' to sign in')}
function setTwoFA(v){me.twofa=v;save();openSettings('account');toast(v?'Two-step sign-in is on':'Two-step sign-in is off')}
function setPublic(v){me.public=v;save();openSettings('profile');if(view.startsWith('profile:'))renderView();toast(v?'Your account is public':'Your account is private')}
function setWood(id){me.wood=id;save();applyWood(id);openSettings('profile');if(view==='shelf')renderView()}
function setAccent(c){me.accent=c;save();applyAccent(c);renderAll();openSettings('profile')}
function pwSend(){const code=sendCode(me.email);$('#pwArea').innerHTML=inboxHTML(me.email,code)+codeForm(me.email)}

function redirect(v){setTimeout(()=>go(v));return''}
/* boot */
if(me)renderAll();else renderAuth(DB.users.length?'login':'signup');
</script>
</body>
</html>
