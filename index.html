<!DOCTYPE html><!-- cache-bust:9999999999 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuke's Nightmarket</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Mochiy+Pop+P+One&family=Quicksand:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1234;
  --bg2:#101a44;
  --card:#16215a;
  --card2:#1d2b70;
  --border:rgba(150,170,255,0.18);
  --border2:rgba(170,150,255,0.34);
  --accent:#ff9ec8;
  --accent2:#b69cff;
  --accent-glow:rgba(255,158,200,0.16);
  --gold:#ff9ec8;
  --gold-dim:rgba(255,158,200,0.14);
  --green:#7fe8c0;
  --red:#ff8aa5;
  --text:#eef0ff;
  --text2:#c8d8ff;
  --text3:#7d88c8;
  --head:'Mochiy Pop One','Mochiy Pop P One',sans-serif;
  --mono:'Share Tech Mono',monospace;
}
html,body{min-height:100%;background:url('nightmarket.png') center/cover fixed;color:var(--text);font-family:'Quicksand',sans-serif;font-size:15px;line-height:1.65;font-weight:500}
body{background-image:none}

/* STARS */
#stars{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:white;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-20px);opacity:0}8%{opacity:1}88%{opacity:.7}100%{transform:translateY(101vh);opacity:0}}

/* LAYOUT */
#app{position:relative;z-index:1;min-height:100vh}
header{position:sticky;top:0;background:rgba(5,9,28,0.95);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-bottom:1px solid rgba(91,143,255,.25);padding:6px 28px 0;display:flex;align-items:center;justify-content:space-between;height:66px;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.logo{font-family:var(--head);font-size:17px;letter-spacing:1px;color:var(--text)}
.logo em{color:var(--accent);font-style:normal}
.domain{font-size:9px;color:var(--text3);letter-spacing:2px;font-family:var(--mono);margin-top:2px}
nav{display:flex;gap:6px}
.nb{background:transparent;border:1px solid transparent;color:var(--text2);padding:6px 16px;border-radius:14px;cursor:pointer;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:500;transition:all .18s}
.nb:hover{color:var(--text);background:rgba(91,143,255,.07)}
.nb.on{color:var(--accent);border-color:rgba(91,143,255,.3);background:var(--accent-glow)}
main{max-width:1150px;margin:0 auto;padding:48px 24px 80px}

/* CARDS */
.card{background:rgba(5,9,28,0.96);border:1px solid var(--border);border-radius:22px}

/* HERO */
.hero{text-align:center;padding:64px 0 56px;background:rgba(5,9,28,0.3);border-radius:20px;margin-bottom:40px;padding:48px 32px}
.pill{display:inline-block;background:rgba(5,9,28,0.85);border:1px solid rgba(255,158,200,.4);color:#ffb8d8;font-size:11px;font-weight:600;letter-spacing:1.5px;padding:6px 18px;border-radius:100px;margin-bottom:22px;font-family:'Quicksand',sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.hero h1{font-family:var(--head);font-size:clamp(26px,5vw,48px);line-height:1.3;margin-bottom:16px}
.hero h1 .g{color:var(--accent2)}
.hero p{color:var(--text2);font-size:14px;max-width:440px;margin:0 auto}
h2,h3{font-family:var(--head);font-weight:400;letter-spacing:.5px;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.8)}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.lcard{background:rgba(5,9,28,0.96);border:1px solid var(--border);border-radius:22px;padding:22px;transition:all .2s;cursor:pointer}
.lcard:hover{border-color:var(--accent);background:var(--card2);transform:translateY(-4px)}
.lcard.sold{opacity:.42;cursor:default;pointer-events:none}

/* TAGS */
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:100px;letter-spacing:.8px;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.t-og{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(255,158,200,.3)}
.t-prem{background:var(--accent-glow);color:var(--accent);border:1px solid rgba(91,143,255,.28)}
.t-niche{background:rgba(62,223,160,.09);color:var(--green);border:1px solid rgba(62,223,160,.22)}
.t-leg{background:rgba(190,110,255,.1);color:#c87aff;border:1px solid rgba(190,110,255,.25)}
.t-cutesy{background:rgba(255,158,200,.12);color:var(--accent);border:1px solid rgba(255,158,200,.35)}
.t-sold{background:rgba(255,255,255,.05);color:var(--text3);border:1px solid var(--border)}

/* BUTTONS */
.btn{background:var(--accent);color:#1a0d20;border:none;padding:10px 22px;border-radius:100px;cursor:pointer;font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;letter-spacing:.3px;transition:all .2s cubic-bezier(.34,.1,.68,1.48);box-shadow:0 4px 12px rgba(255,158,200,.35)}
.btn:hover{opacity:1;filter:brightness(1.1);transform:translateY(-3px);box-shadow:0 8px 20px rgba(255,158,200,.45)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn2{background:transparent;color:#e8f2ff;border:1px solid rgba(91,143,255,.4);padding:9px 20px;border-radius:100px;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:500;transition:all .18s}
.btn2:hover{border-color:var(--border2);color:var(--text)}
.btn-g{background:rgba(62,223,160,.1);color:var(--green);border:1px solid rgba(62,223,160,.24);padding:7px 15px;border-radius:14px;cursor:pointer;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;transition:all .15s}
.btn-r{background:rgba(255,102,128,.1);color:var(--red);border:1px solid rgba(255,102,128,.24);padding:7px 15px;border-radius:14px;cursor:pointer;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:700;transition:all .15s}

/* FORMS */
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:14px;font-family:'Quicksand',sans-serif;font-size:13px;outline:none;transition:border-color .2s;box-sizing:border-box}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
select option{background:var(--card)}
label{display:block;font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px}
.field{margin-bottom:14px}
.err{color:var(--red);font-size:13px;margin-bottom:10px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(2,5,22,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:rgba(5,9,28,0.96);border:1px solid var(--border2);border-radius:26px;width:100%;max-width:490px;max-height:90vh;overflow-y:auto;padding:32px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}

/* PAY TOGGLE */
.ptoggle{display:flex;gap:10px;margin-bottom:18px}
.popt{flex:1;background:transparent;border:1px solid var(--border);color:var(--text2);padding:13px 10px;border-radius:16px;cursor:pointer;text-align:center;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:600;transition:all .18s}
.popt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.popt:hover:not(.on){border-color:var(--border2);color:var(--text)}

/* INFO BOXES */
.ibox{background:rgba(91,143,255,.07);border:1px solid rgba(91,143,255,.15);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.warn{background:rgba(5,9,28,0.92);border:1px solid rgba(182,156,255,.35);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:12px;color:#e8d5ff;line-height:1.6;box-shadow:0 4px 12px rgba(0,0,0,.4)}

/* UPLOAD */
.uzone{border:2px dashed var(--border);border-radius:16px;padding:24px;text-align:center;cursor:pointer;transition:all .2s}
.uzone:hover{border-color:var(--accent);background:var(--accent-glow)}
.uzone.done{border-color:var(--green);background:rgba(62,223,160,.06)}

/* STATUS */
.sbadge{display:inline-block;font-size:11px;font-weight:700;padding:3px 11px;border-radius:100px;text-transform:uppercase;letter-spacing:.8px}
.s-pending{background:rgba(5,9,28,0.9);color:#d8b8ff;border:1px solid rgba(182,156,255,.4)}
.s-approved{background:rgba(5,9,28,0.9);color:#5ffe8f;border:1px solid rgba(62,223,160,.4)}
.s-rejected{background:rgba(255,102,128,.1);color:var(--red);border:1px solid rgba(255,102,128,.22)}

/* CREDS */
.cbox{background:rgba(62,223,160,.06);border:1px solid rgba(62,223,160,.18);border-radius:20px;padding:16px 18px}
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 0;border-bottom:1px solid rgba(62,223,160,.08);font-size:13px}
.crow:last-child{border-bottom:none}
.ckey{color:var(--text3);font-size:12px;flex-shrink:0}
.cval{font-family:var(--mono);font-size:12px;color:var(--green);word-break:break-all;text-align:right}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:28px;border-bottom:1px solid var(--border)}
.tab{background:transparent;border:none;color:var(--text3);padding:10px 18px;cursor:pointer;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .18s}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.on){color:var(--text2)}

/* COPY BTN */
.cpbtn{background:transparent;border:1px solid var(--border);color:var(--text3);padding:3px 9px;border-radius:5px;cursor:pointer;font-size:11px;font-family:var(--mono);transition:all .18s}
.cpbtn:hover{border-color:var(--accent);color:var(--accent)}

hr{border:none;border-top:1px solid var(--border);margin:18px 0}
.empty{text-align:center;padding:48px 0;color:var(--text3)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:768px){
  header{padding:6px 16px;height:60px}
  .logo{font-size:15px}
  nav{gap:4px}
  .nb{padding:6px 12px;font-size:12px}
  main{max-width:100%;padding:32px 12px 60px}
  .hero{padding:36px 20px;margin-bottom:32px}
  .hero h1{font-size:clamp(22px,4vw,36px);margin-bottom:12px}
  .hero p{font-size:13px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .lcard{padding:12px;border-radius:16px}
  .mbox{padding:18px 14px}
}

@media(max-width:480px){
  header{padding:6px 12px}
  .logo{font-size:13px}
  nav{gap:2px}
  .nb{padding:5px 10px;font-size:11px}
  main{padding:24px 10px 50px}
  .hero{padding:28px 16px;margin-bottom:24px;border-radius:16px}
  .hero h1{font-size:clamp(18px,3vw,28px);margin-bottom:10px}
  .hero p{font-size:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .lcard{padding:10px;border-radius:14px}
  .mbox{padding:14px 12px}
  .btn{padding:8px 16px;font-size:12px}
  .btn2{padding:6px 12px;font-size:11px}
}
</style>
</head>
<body>

<div id="stars"></div>
<div id="app">
  <header>
    <div>
      <div class="logo">NUKE'S <em>NIGHTMARKET</em></div>
    </div>
    <nav>
      <button class="nb on" onclick="nav('shop')" id="n-shop">Shop</button>
      <button class="nb" onclick="nav('status')" id="n-status">Track Order</button>
      <button class="nb" onclick="viewCart()" style="position:relative" id="cart-btn">🛒 <span id="cart-count" style="position:absolute;top:-4px;right:-6px;background:var(--accent);color:#000;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center"></span></button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="modal"></div>

<script>
// ── STARS ─────────────────────────────────────────────────────
(function(){
  const c=document.getElementById('stars');
  for(let i=0;i<95;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2.4+.4;
    s.style.cssText=`left:${Math.random()*100}%;width:${sz}px;height:${sz}px;`+
      `opacity:${Math.random()*.65+.15};animation-duration:${Math.random()*11+5}s;`+
      `animation-delay:${Math.random()*14}s;`+
      (Math.random()>.55?`background:${['#ffc4e0','#d4c4ff','#ffffff'][Math.floor(Math.random()*3)]};`:'');
    c.appendChild(s);
  }
})();

// ── DATA ──────────────────────────────────────────────────────
const SAMPLE_LISTINGS=[
  {id:'lst_001',platform:'Instagram',username:'@fittle',price:25,description:'Cutesy Instagram Handle',tag:'Cutesy',available:true,accountStatus:'✓ OGE included',
   creds:{email:'igaccount_fittle@gmail.com',password:'Fittle2024!',recoveryEmail:'backup_fittle@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_002',platform:'Instagram',username:'@flirtage',price:25,description:'Cutesy Instagram Handle',tag:'Cutesy',available:true,accountStatus:'✓ OGE included',
   creds:{email:'igaccount_flirtage@gmail.com',password:'Flirtage2024!',recoveryEmail:'backup_flirtage@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_003',platform:'Valorant',username:'Valorant Account',price:60,description:'Bronze 2 account with premium skin collection. Featuring: Xeno Hunter, Mystbloom 2.0 & Soulstrife Knives, Gaia\'s/Xerofang/Exo/Reaver Vandals, Mystbloom & Singularity Sheriffs, and more.',tag:'Premium',available:true,accountStatus:'✓ Stacked skin collection • Ready to play',
   creds:{email:'valorant_acc@gmail.com',password:'Valorant2024!',recoveryEmail:'backup_val@gmail.com',phone:'N/A',notes:'Account ready for ranked. Change email first for security. Skins include: Xeno Hunter Knife, Mystbloom 2.0 Knife, Soulstrife Scythe, Evori Dreamwings Spellcaster Knife, Reaver Vandal, Gaia\'s Vandal, Xerofang Vandal, Exo Vandal, Mystbloom 2.0 Vandal, Mystbloom Sheriff, Singularity Sheriff, Minima Sheriff, and more coming soon.'}},
  {id:'lst_004',platform:'TikTok',username:'@ofwh',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_ofwh@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_ofwh@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_005',platform:'TikTok',username:'@nmxc',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_nmxc@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_nmxc@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_006',platform:'TikTok',username:'@xnyi',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_xnyi@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_xnyi@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_007',platform:'TikTok',username:'@5aww',price:10,description:'TikTok OGE Account',tag:'4C',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_5aww@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_5aww@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_008',platform:'TikTok',username:'@bnnx',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_bnnx@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_bnnx@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}}
];
const DEF_CFG={
  cashapp:'$htqa',
  cryptoOptions:[
    {name:'Bitcoin',symbol:'BTC',addr:'bc1qeqgsckrgg9xytf6f02z7anpy8khl7lfp4yy7d3',logo:'₿'},
    {name:'Litecoin',symbol:'LTC',addr:'LdTtC1GtoiBguQcMPf7Fu7jpwKYHEqyENh',logo:'Ł'},
    {name:'Ethereum',symbol:'ETH',addr:'0xa94933309fEB1Ec1D392FecaE1C4EE6622b08a78',logo:'◆'}
  ],
  adminPw:'admin123'
};
const PC={Instagram:'#e1306c','X / Twitter':'#7eb8ff',TikTok:'#ff6b8a',YouTube:'#ff4444',Discord:'#7a8fff',Snapchat:'#ffdd57',Facebook:'#4f9bff',Reddit:'#ff7043',Twitch:'#a66bff'};
const TC={'OG':'t-og','Premium':'t-prem','Niche':'t-niche','Legendary':'t-leg','Cutesy':'t-cutesy','4L':'t-4l','4C':'t-4c'};

function load(k,fb){try{const v=localStorage.getItem('omk_'+k);return v?JSON.parse(v):fb}catch{return fb}}
function save(k,v){try{localStorage.setItem('omk_'+k,JSON.stringify(v))}catch{}}
function getListings(){const v=load('listings',null);if(!v||v.length<8||!v.some(l=>l.tag==='4C')){save('listings',SAMPLE_LISTINGS);return SAMPLE_LISTINGS}return v||SAMPLE_LISTINGS}
function getOrders(){return load('orders',[])}
function getCfg(){return{...DEF_CFG,...load('cfg',{})}}
function saveListings(v){save('listings',v)}
function saveOrders(v){save('orders',v)}
function saveCfg(v){save('cfg',v)}
function gid(){return'ORD-'+Math.random().toString(36).substr(2,9).toUpperCase()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function cap(s){if(!s)return'';if(s==='recoveryEmail')return'Recovery Email';if(s==='cryptoAddr')return'Crypto Addr';return s.charAt(0).toUpperCase()+s.slice(1)}

// ── STATE ─────────────────────────────────────────────────────
let page='shop',adminOk=false,aTab='orders';
let buyLid=null,buyStep=1,payM='cashapp',proofB64=null,proofName=null;
let cart=[];
let platformFilter=[];

// ── NAV ───────────────────────────────────────────────────────
function nav(p){
  page=p;
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  const btn=document.getElementById('n-'+p);
  if(btn)btn.classList.add('on');
  render();
}

// ── SHOP ──────────────────────────────────────────────────────
function togglePlatformFilter(platform){
  if(platformFilter.includes(platform)){
    platformFilter=platformFilter.filter(p=>p!==platform);
  }else{
    platformFilter.push(platform);
  }
  render();
}

function renderShop(){
  const ls=getListings();
  const platforms=[...new Set(ls.map(l=>l.platform))].sort();
  
  // Filter listings based on selected platforms
  const filtered=platformFilter.length>0?ls.filter(l=>!platformFilter.includes(l.platform)):ls;
  
  const cards=filtered.map(l=>{
    const pc=PC[l.platform]||'#8aa4d8';
    const tc=TC[l.tag]||'t-niche';
    const inCart = cart.find(c => c.id === l.id);
    return`<div class="lcard${!l.available?' sold':''}" style="display:flex;flex-direction:column;padding:14px">`+
      `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">`+
      `<span style="color:${pc};font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase">${esc(l.platform)}</span>`+
      `<div>${l.tag?`<span class="tag ${tc}">${esc(l.tag)}</span>`:''}`+
      `${!l.available?'<span class="tag t-sold" style="margin-left:5px">Sold</span>':''}</div></div>`+
      `<div style="font-family:var(--head);font-size:20px;font-weight:700;color:#e4efff;margin-bottom:6px;word-break:break-all;cursor:pointer" onclick="openBuy('${l.id}')">${esc(l.username)}</div>`+
      `<p style="color:var(--text2);font-size:11px;line-height:1.4;margin-bottom:10px;min-height:22px">${esc(l.description)}</p>`+
      `<div style="background:rgba(5,9,28,0.9);border:1px solid rgba(182,156,255,.35);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:10px;color:#d8e8ff;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.4)">`+
      `<strong style="color:var(--text)">Status:</strong> ${esc(l.accountStatus||'✓ Standard account included')}`+
      `</div>`+
      `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:auto">`+
      `<div style="margin-bottom:0"><div style="font-size:9px;color:var(--text3);letter-spacing:0.5px;font-weight:700;margin-bottom:1px">PRICE</div>`+
      `<div style="font-family:var(--head);font-size:18px;color:var(--accent2)">$${l.price.toLocaleString()}</div></div>`+
      `<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${l.available?`<button class="btn" onclick="event.stopPropagation();addToCart('${l.id}')" style="font-size:11px;padding:6px 12px;background:${inCart?'var(--green)':'var(--accent)'}">${inCart?'✓ Cart':'Buy'}</button><button class="btn" onclick="event.stopPropagation();openBuy('${l.id}')" style="font-size:11px;padding:6px 12px">Info</button>`:''}`+
      `</div></div></div>`;
  }).join('');
  
  const filterButtons=platforms.map(p=>

    `<h2 style="font-family:var(--head);font-size:32px;font-weight:700;margin-bottom:8px">Track Your Order</h2>`+

function chkOrder(){
  const id=(document.getElementById('oid')?.value||'').trim().toUpperCase();
  const el=document.getElementById('ores');
  if(!el)return;
  const o=getOrders().find(x=>x.id===id);
  if(!o){
    el.innerHTML=`<div style="background:rgba(255,102,128,.08);border:1px solid rgba(255,102,128,.2);border-radius:20px;padding:16px 18px;color:var(--red)">Order not found. Please double-check your ID.</div>`;
    return;
  }
  let credHtml='';
  if(o.status==='approved'){
    const l=getListings().find(x=>x.id===o.listingId);
    if(l?.creds){
      const rows=Object.entries(l.creds).filter(([,v])=>v&&v!=='N/A')
        .map(([k,v])`=><div class="crow"><span class="ckey">${cap(k)}</span><span class="cval">${esc(v)}</span></div>`).join('');
      credHtml=`<div style="margin-top:18px"><div style="font-size:11px;font-weight:700;color:var(--green);letter-spacing:1.5px;margin-bottom:10px">✓ ACCOUNT CREDENTIALS</div><div class="cbox">${rows}</div><p style="color:var(--text3);font-size:11px;margin-top:11px;line-height:1.6">⚠ Change your password and email immediately. Keep these credentials private.</p></div>`;
    }
  }
  const proofLine=o.payMethod==='cashapp'&&o.proofB64?`<div style="font-size:11px;color:var(--text3);margin-top:8px">Screenshot submitted ✓</div>`:o.payMethod==='crypto'&&o.txId?`<div style="font-size:11px;color:var(--text3);margin-top:8px">TX: <span style="font-family:var(--mono);color:var(--text2)">${esc(o.txId.substring(0,40))}…</span></div>`:'';
  el.innerHTML=`<div class="card" style="padding:22px">`+
    `<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">`+
    `<div><div style="font-family:var(--mono);font-size:12px;color:var(--text3);margin-bottom:4px">${esc(o.id)}</div>`+
    `<div style="font-size:16px;font-weight:600">${esc(o.listingPlatform)} · <span style="font-family:var(--mono);color:var(--accent)">${esc(o.listingUsername)}</span></div>`+
    `<div style="font-family:var(--head);font-size:16px;color:var(--gold);margin-top:3px">$${(o.listingPrice||0).toLocaleString()}</div></div>`+
    `<span class="sbadge s-${o.status}">${o.status}</span></div><hr>`+
    `<div style="font-size:13px;color:var(--text2);display:flex;flex-direction:column;gap:4px">`+
    `<div>Buyer: <span style="color:var(--text)">${esc(o.buyerName)}</span></div>`+
    `<div>Discord: <span style="color:var(--text)">${esc(o.buyerDiscord||'N/A')}</span></div>`+
    `<div>Email: <span style="color:var(--text)">${esc(o.buyerEmail)}</span></div>`+
    `<div>Payment: <span style="color:var(--text)">${o.payMethod==='cashapp'?'CashApp':'Crypto'}</span></div>`+
    `<div>Placed: <span style="color:var(--text)">${new Date(o.createdAt).toLocaleString()}</span></div></div>`+
    proofLine+
    (o.status==='pending'?`<div style="margin-top:16px;background:rgba(182,156,255,.1);border:1px solid rgba(182,156,255,.26);border-radius:16px;padding:14px;font-size:13px;color:#cdb8ff">⏳ Payment is under review. Credentials will appear here once approved.</div>`:'')+
    (o.status==='rejected'?`<div style="margin-top:16px;background:rgba(255,102,128,.07);border:1px solid rgba(255,102,128,.18);border-radius:16px;padding:14px;font-size:13px;color:var(--red)">✗ This order was not approved. Contact support if you believe this is an error.</div>`:'')+

function renderAOrders(orders,ls){
  if(!orders.length)return'<div class="empty">No orders yet.</div>';
  return[...orders].sort((a,b)=>{const r={pending:0,approved:1,rejected:2};return r[a.status]-r[b.status]||new Date(b.createdAt)-new Date(a.createdAt);})
    .map(o=>{
      const proof=o.payMethod==='cashapp'&&o.proofB64?`<button class="btn2" onclick="viewProof(${JSON.stringify(o.id)})" style="font-size:11px;padding:4px 11px;margin-top:8px">View Screenshot</button>`:
        o.payMethod==='crypto'&&o.txId?`<div style="font-size:11px;color:var(--text3);margin-top:7px;word-break:break-all">TX: <span style="font-family:var(--mono);color:var(--text2)">${esc(o.txId)}</span></div>`:'';
      const acts=o.status==='pending'?`<div style="display:flex;gap:8px;flex-shrink:0"><button class="btn-g" onclick="appOrder(${JSON.stringify(o.id)})">✓ Approve</button><button class="btn-r" onclick="rejOrder(${JSON.stringify(o.id)})">✗ Reject</button></div>`:`<span class="sbadge s-${o.status}">${o.status}</span>`;
      const l=ls.find(x=>x.id===o.listingId);
      const credHtml=o.status==='approved'&&l?.creds?`<hr><div style="font-size:11px;font-weight:700;color:var(--green);letter-spacing:1.2px;margin-bottom:8px">CREDENTIALS RELEASED</div><div class="cbox">${Object.entries(l.creds).filter(([,v])=>v&&v!=='N/A').map(([k,v])`=><div class="crow"><span class="ckey">${cap(k)}</span><span class="cval">${esc(v)}</span></div>`).join('')}</div>`:'';
      return`<div class="card" style="padding:18px 20px;margin-bottom:10px">`+
        `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap">`+
        `<div style="flex:1;min-width:0">`+
        `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${esc(o.id)}</span><span class="sbadge s-${o.status}">${o.status}</span></div>`+
        `<div style="font-size:15px;font-weight:600;margin-bottom:3px">${esc(o.listingPlatform)} · <span style="font-family:var(--mono);color:var(--accent)">${esc(o.listingUsername)}</span> <span style="font-family:var(--head);font-size:13px;color:var(--gold)">$${(o.listingPrice||0).toLocaleString()}</span></div>`+
        `<div style="font-size:12px;color:var(--text2)">${esc(o.buyerName)} · ${esc(o.buyerEmail)} · ${o.payMethod==='cashapp'?'CashApp':'Crypto'}</div>`+
        `<div style="font-size:11px;color:var(--text3);margin-top:3px">${new Date(o.createdAt).toLocaleString()}</div>`+
        proof+`</div>${acts}</div>${credHtml}</div>`;
    }).join('');
}

// ── ADMIN ACTIONS ─────────────────────────────────────────────
function aLogin(){
  const pw=document.getElementById('apw')?.value;
  if(pw===getCfg().adminPw){adminOk=true;render()}
  else{const e=document.getElementById('aerr');if(e)e.innerHTML='<span class="err">Incorrect password.</span>'}
}
function aLogout(){adminOk=false;render()}
function setTab(t){
  aTab=t;
  document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('on',['orders','listings','settings'][i]===t)});
  const el=document.getElementById('atc');
  if(!el)return;
  const o=getOrders(),l=getListings();
  if(t==='orders')el.innerHTML=renderAOrders(o,l);
  else if(t==='listings')el.innerHTML=renderAListings(l);
  else el.innerHTML=renderASettings();
}
function appOrder(id){
  const orders=getOrders();
  const o=orders.find(x=>x.id===id);
  if(o){const ls=getListings();saveListings(ls.map(l=>l.id===o.listingId?{...l,available:false}:l))}
  saveOrders(orders.map(o=>o.id===id?{...o,status:'approved'}:o));
  setTab('orders');
}
function rejOrder(id){
  if(!confirm('Reject this order?'))return;
  saveOrders(getOrders().map(o=>o.id===id?{...o,status:'rejected'}:o));
  setTab('orders');
}
function delL(id){if(!confirm('Delete this listing?'))return;saveListings(getListings().filter(l=>l.id!==id));setTab('listings')}
function restL(id){saveListings(getListings().map(l=>l.id===id?{...l,available:true}:l));setTab('listings')}
function addL(){
  const u=document.getElementById('nu')?.value?.trim();
  const pr=parseFloat(document.getElementById('npr')?.value||0);
  if(!u||!pr){alert('Username and price are required.');return}
  saveListings([...getListings(),{
    id:'lst_'+Date.now(),
    platform:document.getElementById('np')?.value||'Instagram',
    username:u,price:pr,
    description:document.getElementById('nd')?.value?.trim()||'',
    tag:document.getElementById('nt')?.value||'',
    available:true,
    creds:{
      email:document.getElementById('ce')?.value?.trim()||'',
      password:document.getElementById('cp')?.value?.trim()||'',
      recoveryEmail:document.getElementById('cr')?.value?.trim()||'N/A',
      phone:document.getElementById('cph')?.value?.trim()||'N/A',
      notes:document.getElementById('cn')?.value?.trim()||''
    }
  }]);
  setTab('listings');
}
function saveSettings(){
  const c=getCfg();
  const p1=document.getElementById('np1')?.value;
  const p2=document.getElementById('np2')?.value;
  const msg=document.getElementById('smsg');
  if(p1&&p1!==p2){if(msg)msg.innerHTML='<span class="err">Passwords do not match.</span>';return}
  
  // Update crypto addresses from form inputs
  const updatedCrypto = c.cryptoOptions.map((co,i) => ({
    ...co,
    addr: document.getElementById(`crypto${i}`)?.value?.trim() || co.addr
  }));
  
  saveCfg({...c,
    cashapp:document.getElementById('ca')?.value?.trim()||c.cashapp,
    cryptoOptions:updatedCrypto,
    ...(p1?{adminPw:p1}:{})
  });
  if(msg)msg.innerHTML='<span style="color:var(--green);font-size:13px">✓ Settings saved.</span>';
  setTimeout(()=>{if(msg)msg.innerHTML=''},3000);
}
function viewProof(id){
  const o=getOrders().find(x=>x.id===id);
  if(!o?.proofB64)return;
  document.getElementById('modal').innerHTML=`<div class="overlay" onclick="closeMod()">`+
    `<div style="max-width:480px;width:100%;background:rgba(5,9,28,0.96);border:1px solid var(--border2);border-radius:16px;padding:22px" onclick="event.stopPropagation()">`+
    `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-weight:600">Payment Screenshot</span><button onclick="closeMod()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:22px;line-height:1">×</button></div>`+
    `<img src="${o.proofB64}" style="max-width:100%;border-radius:14px;border:1px solid var(--border)"></div></div>`;
}

// ── BUY MODAL ─────────────────────────────────────────────────
function openBuy(lid){
  const l=getListings().find(x=>x.id===lid);
  if(!l||!l.available)return;
  buyLid=lid;buyStep=1;payM='cashapp';proofB64=null;proofName=null;
  drawBuy(l);
}

function drawBuy(l){
  const cfg=getCfg();
  const pc=PC[l.platform]||'#8aa4d8';
  
  // Build crypto option buttons dynamically
  const cryptoOpts = cfg.cryptoOptions.map(c => 
    `<button class="popt${payM===c.symbol?' on':''}" onclick="setPayM('${c.symbol}')" style="flex:1">`+
    `<div style="font-size:16px;margin-bottom:3px">${c.symbol==='BTC'?'₿':c.symbol==='LTC'?'Ł':'◆'}</div>`+
    `<div style="font-size:11px">${c.name}</div></button>`
  ).join('');
  
  const step1=`<div>`+
    `<div style="margin-bottom:16px">`+
    `<div style="font-size:11px;font-weight:700;color:${pc};letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">${esc(l.platform)}</div>`+
    `<div style="font-family:var(--mono);font-size:26px;font-weight:700;color:#e4efff">${esc(l.username)}</div>`+
    `<div style="font-family:var(--head);font-size:22px;color:var(--gold);margin-top:5px">$${l.price.toLocaleString()}</div>`+
    `<p style="color:var(--text2);font-size:13px;margin-top:7px;line-height:1.6">${esc(l.description)}</p></div><hr>`+
    `<div style="font-size:11px;font-weight:700;color:var(--text2);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:14px">Choose Payment Method</div>`+
    `<div class="ptoggle">`+
    `<button class="popt${payM==='cashapp'?' on':''}" onclick="setPayM('cashapp')" style="flex:1;display:flex;flex-direction:column;align-items:center">`+
    `<svg width="20" height="20" viewBox="0 0 100 100" style="margin-bottom:4px"><circle cx="50" cy="50" r="48" fill="white" stroke="#007AFF" stroke-width="2"/><text x="50" y="60" font-size="45" font-weight="bold" fill="#007AFF" text-anchor="middle">$</text></svg>`+
    `<div style="font-size:11px">CashApp</div></button>`+
    cryptoOpts+
    `</div>`+
    (payM==='cashapp'?
      `<div class="ibox"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Send To</div>`+
      `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px"><span style="color:var(--text2);font-size:13px">CashApp Tag</span><div style="display:flex;align-items:center;gap:8px"><span style="font-family:var(--mono);font-size:15px;color:var(--text)">${esc(cfg.cashapp)}</span><button class="cpbtn" onclick="cp(${JSON.stringify(cfg.cashapp)})">copy</button></div></div>`+
      `<div style="display:flex;align-items:center;justify-content:space-between"><span style="color:var(--text2);font-size:13px">Amount</span><span style="font-family:var(--mono);font-size:15px;color:var(--gold)">$${l.price.toLocaleString()}</span></div></div>`+
      `<div class="warn">⚠ Your screenshot <strong>must clearly show</strong> that payment was sent from your <strong>CashApp balance</strong>. Screenshots from bank or card will not be accepted.</div>`
    :
      (() => {
        const selected = cfg.cryptoOptions.find(c => c.symbol === payM);
        if (!selected) return '';
        return `<div class="ibox"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Send To ${selected.name}</div>`+
        `<div style="margin-bottom:8px"><button class="cpbtn" onclick="cp(${JSON.stringify(selected.addr)})" style="float:right">copy address</button>`+
        `<div style="font-family:var(--mono);font-size:11px;color:var(--text);word-break:break-all;background:rgba(255,255,255,.04);padding:8px 10px;border-radius:6px">${esc(selected.addr)}</div></div>`+
        `<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px"><span style="color:var(--text2);font-size:13px">Amount (USD equiv.)</span><span style="font-family:var(--mono);color:var(--gold)">$${l.price.toLocaleString()}</span></div></div>`;
      })()
    )+
    `<button class="btn" onclick="buyNext()" style="width:100%;padding:12px;font-size:14px">Continue →</button></div>`;

  const step2=`<div>`+
    `<button onclick="buyBack()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;padding:0;margin-bottom:14px">← Back</button>`+
    `<h3 style="font-size:18px;font-weight:700;margin-bottom:6px">${payM==='cashapp'?'Upload Screenshot':'Enter Transaction ID'}</h3>`+
    `<p style="color:var(--text2);font-size:13px;margin-bottom:18px">${payM==='cashapp'?'Upload a screenshot showing the payment sent from your CashApp balance.':'After sending payment, paste the full transaction ID from your wallet.'}</p>`+
    (payM==='cashapp'?
      `<div class="uzone${proofB64?' done':''}" onclick="document.getElementById('pfil').click()" id="uz">`+
      `<input type="file" id="pfil" accept="image/*" style="display:none" onchange="handleProof(this)">`+
      (proofB64?`<div style="color:var(--green);font-weight:600;margin-bottom:4px">✓ Screenshot uploaded</div><div style="color:var(--text3);font-size:12px">${esc(proofName||'')}</div><img src="${proofB64}" style="max-width:100%;max-height:140px;object-fit:contain;margin-top:10px;border-radius:6px">`:`<div style="font-size:28px;opacity:.35;margin-bottom:8px">📸</div><div style="color:var(--text2);font-size:13px">Click to upload screenshot</div><div style="color:var(--text3);font-size:11px;margin-top:3px">JPG or PNG</div>`)+`</div>`
    :
      `<div class="field"><label>Transaction ID / Hash</label><textarea id="txinp" rows="3" placeholder="Paste your full transaction hash here..." style="font-family:var(--mono);font-size:12px;resize:none"></textarea></div>`
    )+
    `<hr><div class="field"><label>Your Name</label><input type="text" id="bname" placeholder="Full name"></div>`+
    `<div class="field"><label>Discord Username</label><input type="text" id="bdiscord" placeholder="YourName#1234"></div>`+
    `<div class="field"><label>Email Address</label><input type="email" id="bemail" placeholder="you@email.com"></div>`+
    `<div id="berr" style="margin-bottom:10px"></div>`+
    `<div style="background:rgba(182,156,255,.1);border:1px solid rgba(182,156,255,.24);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:11px;color:#cdb8ff;line-height:1.65">`+
    `<strong>⏱ Payment Policy</strong><br>• Review takes <strong>up to 24 hours</strong><br>• <strong>No cancellations</strong> after sending payment<br>• <strong>No refunds</strong> unless our error<br>• Final sale once submitted`+
    `</div>`+
    `<div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;padding:12px 14px;background:rgba(182,156,255,.08);border:1px solid rgba(182,156,255,.18);border-radius:10px">`+
    `<input type="checkbox" id="toscheck" style="margin-top:2px;cursor:pointer;width:18px;height:18px;flex-shrink:0">`+
    `<label for="toscheck" style="margin:0;font-size:12px;color:var(--text2);line-height:1.6;cursor:pointer">I have read and agree to Nuke's Nightmarket <strong><a href="javascript:void(0)" onclick="window.open('#tos','_blank')" style="color:var(--accent);text-decoration:underline">Terms of Service</a></strong>. I understand this is a final sale with no refunds.</label>`+
    `</div>`+
    `<button class="btn" onclick="submitBuy()" style="width:100%;padding:12px;font-size:14px">Submit Order</button></div>`;

  document.getElementById('modal').innerHTML=`<div class="overlay" onclick="closeMod()">`+
    `<div class="mbox" onclick="event.stopPropagation()">`+
    `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px">`+
    `<div style="font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:1px">STEP ${buyStep} OF 2</div>`+
    `<button onclick="closeMod()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:24px;line-height:1;padding:0">×</button></div>`+
    (buyStep===1?step1:step2)+`</div></div>`;
}

function setPayM(m){payM=m;const l=getListings().find(x=>x.id===buyLid);if(l)drawBuy(l)}
function buyNext(){buyStep=2;const l=getListings().find(x=>x.id===buyLid);if(l)drawBuy(l)}
function buyBack(){buyStep=1;const l=getListings().find(x=>x.id===buyLid);if(l)drawBuy(l)}
function handleProof(inp){
  const f=inp.files[0];if(!f)return;
  proofName=f.name;
  const r=new FileReader();
  r.onload=e=>{proofB64=e.target.result;const l=getListings().find(x=>x.id===buyLid);if(l)drawBuy(l)};
  r.readAsDataURL(f);
}
function submitBuy(){
  const name=document.getElementById('bname')?.value?.trim();
  const discord=document.getElementById('bdiscord')?.value?.trim();
  const email=document.getElementById('bemail')?.value?.trim();
  const tosChecked=document.getElementById('toscheck')?.checked;
  const errEl=document.getElementById('berr');
  if(!name||!discord||!email){if(errEl)errEl.innerHTML='<span class="err">Please fill in all fields (name, Discord, email).</span>';return}
  if(!tosChecked){if(errEl)errEl.innerHTML='<span class="err">You must agree to the Terms of Service to proceed.</span>';return}
  if(!/\S+@\S+\.\S+/.test(email)){if(errEl)errEl.innerHTML='<span class="err">Please enter a valid email address.</span>';return}
  let txId='';
  if(payM==='cashapp'){
    if(!proofB64){if(errEl)errEl.innerHTML='<span class="err">Please upload your payment screenshot.</span>';return}
  } else {
    txId=document.getElementById('txinp')?.value?.trim()||'';
    if(!txId){if(errEl)errEl.innerHTML='<span class="err">Please paste your transaction ID.</span>';return}
  }
  const l=getListings().find(x=>x.id===buyLid);
  if(!l)return;
  const oid=gid();
  saveOrders([...getOrders(),{
    id:oid,listingId:buyLid,listingUsername:l.username,listingPlatform:l.platform,listingPrice:l.price,
    buyerName:name,buyerDiscord:discord,buyerEmail:email,payMethod:payM,txId,proofB64:proofB64||'',
    status:'pending',createdAt:new Date().toISOString()
  }]);
  document.getElementById('modal').innerHTML=`<div class="overlay">`+
    `<div class="mbox" style="text-align:center;padding:40px 32px">`+
    `<div style="font-size:54px;margin-bottom:14px">🌙</div>`+
    `<h3 style="font-family:var(--head);font-size:24px;font-weight:700;margin-bottom:10px">Order Submitted!</h3>`+
    `<p style="color:var(--text2);font-size:14px;line-height:1.7;margin-bottom:24px">Your payment is being reviewed. Once approved, your account credentials will be available using the Order ID below.</p>`+
    `<div style="background:var(--accent-glow);border:1px solid rgba(91,143,255,.25);border-radius:20px;padding:16px 20px;margin-bottom:24px">`+
    `<div style="font-size:10px;color:var(--text3);letter-spacing:1.5px;margin-bottom:7px">YOUR ORDER ID — SAVE THIS</div>`+
    `<div style="font-family:var(--mono);font-size:22px;color:var(--accent);letter-spacing:2px">${oid}</div>`+
    `<button class="cpbtn" onclick="cp(${JSON.stringify(oid)})" style="margin-top:9px">copy</button></div>`+
    `<div style="background:rgba(182,156,255,.1);border:1px solid rgba(182,156,255,.24);border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:12px;color:#cdb8ff;line-height:1.65">`+
    `<strong>⏱ Payment Policy:</strong><br>`+
    `• Payment review may take <strong>up to 24 hours</strong><br>`+
    `• <strong>No cancellations</strong> after payment is sent<br>`+
    `• <strong>No refunds</strong> except if error is on our end<br>`+
    `• Your order is final once payment is submitted`+
    `</div>`+
    `<div style="display:flex;gap:10px">`+
    `<button class="btn2" onclick="closeMod()" style="flex:1">Close</button>`+
    `<button class="btn" onclick='closeMod();nav("status");setTimeout(()=>{const i=document.getElementById("oid");if(i){i.value=${JSON.stringify(oid)};chkOrder()}},120)' style="flex:1">Track Order</button></div></div></div>`;
}
function closeMod(){document.getElementById('modal').innerHTML='';buyLid=null}
function cp(t){navigator.clipboard?.writeText(t)}

// ── CART ───────────────────────────────────────────────────────
function addToCart(lid){
  const ls=getListings();
  const l=ls.find(x=>x.id===lid);
  if(!l)return;
  const inCart=cart.find(c=>c.id===lid);
  if(!inCart){cart.push({id:lid,title:l.username,price:l.price,platform:l.platform});render()}
}
function removeFromCart(lid){cart=cart.filter(c=>c.id!==lid);render()}
function viewCart(){
  if(cart.length===0){
    document.getElementById('modal').innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px">`+
      `<div style="background:rgba(5,9,28,0.95);border:1px solid rgba(182,156,255,.35);border-radius:18px;padding:40px 30px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.8);text-align:center">`+
      `<h2 style="font-family:var(--head);font-size:24px;margin-bottom:10px">Your Cart is Empty</h2>`+
      `<p style="color:var(--text2);margin-bottom:20px">Add some accounts to get started!</p>`+
      `<button class="btn" onclick="document.getElementById('modal').innerHTML='';nav('shop')" style="width:100%;padding:12px">Continue Shopping</button>`+
      `</div></div>`;
  }else{
    const subtotal=cart.reduce((s,i)=>s+i.price,0);
    const discount=cart.length>1?3:0;
    const total=subtotal-discount;
    const items=cart.map(i=>`<div class="card" style="padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px">`+
      `<div><div style="font-size:12px;color:var(--text3)">${esc(i.platform)}</div>`+
      `<div style="font-family:var(--head);font-size:16px;color:#e4efff">${esc(i.title)}</div>`+
      `<div style="font-size:13px;color:var(--accent2)">$${i.price.toLocaleString()}</div></div>`+
      `<button class="btn-r" onclick="removeFromCart('${i.id}');viewCart()" style="white-space:nowrap;padding:6px 10px;font-size:11px">Remove</button>`+
      `</div>`).join('');
    
    const couponHtml=discount>0?`<div style="background:rgba(127,232,192,.15);border:1px solid rgba(127,232,192,.3);border-radius:12px;padding:12px;margin-bottom:16px;text-align:center">`+
      `<div style="font-size:12px;color:var(--green);font-weight:700;letter-spacing:1px;margin-bottom:4px">✓ MULTI-ITEM DISCOUNT</div>`+
      `<div style="font-size:13px;color:var(--green)">You saved <strong>$3</strong> by buying multiple accounts!</div>`+
      `</div>`:'';
    
    document.getElementById('modal').innerHTML=`<div style="position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto">`+
      `<div style="background:rgba(5,9,28,0.95);border:1px solid rgba(182,156,255,.35);border-radius:18px;padding:30px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.8)">`+
      `<h2 style="font-family:var(--head);font-size:26px;margin-bottom:20px;color:#e4efff">Shopping Cart</h2>`+
      `<div style="max-height:400px;overflow-y:auto;margin-bottom:20px">${items}</div>`+
      `${couponHtml}`+
      `<div style="border-top:1px solid rgba(182,156,255,.35);padding-top:16px;margin-bottom:20px">`+
      `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">`+
      `<span style="color:var(--text2);font-size:14px">Subtotal:</span>`+
      `<span style="color:var(--text2);font-size:14px">$${subtotal.toLocaleString()}</span>`+
      `</div>`+
      (discount>0?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">`+
      `<span style="color:var(--green);font-size:14px;font-weight:700">Discount:</span>`+
      `<span style="color:var(--green);font-size:14px;font-weight:700">-$${discount}</span>`+
      `</div>`:'')+
      `<div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid rgba(182,156,255,.2)">`+
      `<span style="font-family:var(--head);font-size:18px;color:#e4efff">Total:</span>`+
      `<span style="font-family:var(--head);font-size:22px;color:var(--accent2)">$${total.toLocaleString()}</span>`+
      `</div></div>`+
      `<div style="display:flex;gap:10px">`+
      `<button class="btn" onclick="document.getElementById('modal').innerHTML=''" style="flex:1;padding:12px">Add to Cart</button>`+
      `<button class="btn" style="flex:1;padding:12px;background:var(--green)" onclick="document.getElementById('modal').innerHTML='';${cart.length===1?`openBuy('${cart[0].id}')`:`alert('You have ${cart.length} items. Click Buy Now on individual items to purchase them one at a time.')`}">Buy Now</button>`+
      `</div>`+
      `<button onclick="document.getElementById('modal').innerHTML=''" style="margin-top:14px;background:transparent;border:1px solid var(--border);color:var(--text3);padding:8px;border-radius:8px;cursor:pointer;width:100%;font-family:'Quicksand',sans-serif;font-size:12px">Close</button>`+
      `</div></div>`;
  }
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  const m=document.getElementById('main');
  if(page==='shop')m.innerHTML=renderShop();
  else if(page==='status')m.innerHTML=renderStatus();
  else if(page==='tos')m.innerHTML=renderToS();
  
  // Update cart count
  const cnt=document.getElementById('cart-count');
  if(cnt)cnt.innerHTML=cart.length>0?cart.length:'';
}

    `<li>Accounts purchased here are at the buyer's risk</li>`+
    `</ul>`+

    `<div>`+
    `<h3 style="font-family:var(--head);font-size:18px;margin-bottom:10px">6. Account Credentials & Information</h3>`+
    `<p style="color:var(--text2);line-height:1.8">All account information provided (email, password, recovery options) is accurate at the time of delivery. <strong>You must change all credentials immediately upon receipt.</strong> Failure to do so puts your account at risk. We are not responsible for accounts compromised due to failure to secure credentials.</p>`+
    `</div>`+
    
    `<div>`+
    `<h3 style="font-family:var(--head);font-size:18px;margin-bottom:10px">7. Limitation of Liability</h3>`+

    `</ul>`+

render();
</script>
