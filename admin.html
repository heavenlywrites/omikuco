<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nuke's Nightmarket - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Quicksand:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a1234;--bg2:#101a44;--card:#16215a;--card2:#1d2b70;
      --border:rgba(150,170,255,0.18);--border2:rgba(170,150,255,0.34);
      --accent:#ff9ec8;--accent2:#b69cff;--accent-glow:rgba(255,158,200,0.16);
      --green:#7fe8c0;--red:#ff8aa5;--text:#e8f2ff;--text2:#c8d8ff;--text3:#7d88c8;
      --gold:#ffc857;--gold-dim:rgba(255,200,87,.12);
      --head:'Mochiy Pop One','Mochiy Pop P One',sans-serif;
      --mono:'Share Tech Mono',monospace;
    }
    body{background:var(--bg);color:var(--text);font-family:'Quicksand',sans-serif;font-size:14px;line-height:1.6}
    h1,h2,h3{font-family:var(--head)}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    input,textarea,select{background:rgba(22,33,90,0.7);border:1px solid var(--border2);color:var(--text);padding:10px 14px;border-radius:8px;font-family:inherit;font-size:13px}
    input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 2px rgba(182,156,255,0.2)}
    .btn{background:var(--accent);color:#1a0d20;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;transition:all .2s}
    .btn:hover{opacity:0.9;transform:translateY(-1px)}
    .btn2{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;transition:all .2s}
    .btn2:hover{background:rgba(255,158,200,0.1)}
    .btn-g{background:var(--green);color:#0a1234;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:11px}
    .btn-g:hover{opacity:0.9}
    .btn-r{background:var(--red);color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:11px}
    .btn-r:hover{opacity:0.9}
    .card{background:rgba(5,9,28,0.9);border:1px solid rgba(182,156,255,.35);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
    .tabs{display:flex;gap:0;border-bottom:1px solid var(--border2);margin-bottom:20px}
    .tab{background:transparent;color:var(--text3);border:none;padding:12px 16px;cursor:pointer;font-weight:600;font-size:13px;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
    .tab:hover{color:var(--text2)}
    .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
    .empty{padding:40px 20px;text-align:center;color:var(--text3)}
    .sbadge{display:inline-block;font-size:10px;padding:4px 8px;border-radius:6px;font-weight:700}
    .s-pending{background:rgba(182,156,255,.2);color:var(--accent2)}
    .s-approved{background:rgba(127,232,192,.2);color:var(--green)}
    .s-rejected{background:rgba(255,138,165,.2);color:var(--red)}
    .tag{display:inline-block;font-size:10px;padding:3px 8px;border-radius:5px;margin-right:4px}
    .t-og{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(255,200,87,.3)}
    .t-prem{background:var(--accent-glow);color:var(--accent);border:1px solid rgba(91,143,255,.28)}
    .t-niche{background:rgba(62,223,160,.09);color:var(--green);border:1px solid rgba(62,223,160,.22)}
    .t-leg{background:rgba(190,110,255,.1);color:#c87aff;border:1px solid rgba(190,110,255,.25)}
    .t-cutesy{background:rgba(255,158,200,.12);color:var(--accent);border:1px solid rgba(255,158,200,.35)}
    .t-4l{background:rgba(182,156,255,.12);color:var(--accent2);border:1px solid rgba(182,156,255,.3)}
    .t-4c{background:rgba(182,156,255,.12);color:var(--accent2);border:1px solid rgba(182,156,255,.3)}
    .t-sold{background:rgba(255,255,255,.05);color:var(--text3);border:1px solid var(--border)}
    .cbox{background:rgba(0,0,0,0.3);border-left:3px solid var(--green);padding:12px;border-radius:6px;margin-top:8px}
    .crow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(127,232,192,.2)}
    .crow:last-child{border-bottom:none}
    .ckey{font-weight:700;color:var(--text3);min-width:100px}
    .cval{font-family:var(--mono);color:var(--text);word-break:break-all}
    hr{border:none;border-top:1px solid var(--border2);margin:12px 0}
  </style>
</head>
<body>
<div id="root"></div>
<script>
// ── STATE ─────────────────────────────────────────────────────
let adminOk=false,aTab='orders';

// ── STORAGE ───────────────────────────────────────────────────
const save=(k,v)=>localStorage.setItem('omk_'+k,JSON.stringify(v));
const load=(k,def)=>{try{return JSON.parse(localStorage.getItem('omk_'+k))||def}catch{return def}};

const SAMPLE_LISTINGS=[
  {id:'lst_001',platform:'Instagram',username:'@fittle',price:25,description:'Cutesy Instagram Handle',tag:'Cutesy',available:true,accountStatus:'✓ OGE included',
   creds:{email:'igaccount_fittle@gmail.com',password:'Fittle2024!',recoveryEmail:'backup_fittle@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_002',platform:'Instagram',username:'@flirtage',price:25,description:'Cutesy Instagram Handle',tag:'Cutesy',available:true,accountStatus:'✓ OGE included',
   creds:{email:'igaccount_flirtage@gmail.com',password:'Flirtage2024!',recoveryEmail:'backup_flirtage@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_003',platform:'Valorant',username:'Valorant Account',price:60,description:'Bronze 2 account with premium skin collection. Featuring: Xeno Hunter, Mystbloom 2.0 & Soulstrife Knives, Gaia\'s/Xerofang/Exo/Reaver Vandals, Mystbloom & Singularity Sheriffs, and more.',tag:'Premium',available:true,accountStatus:'✓ Stacked skin collection • Ready to play',
   creds:{email:'valorant_acc@gmail.com',password:'Valorant2024!',recoveryEmail:'backup_val@gmail.com',phone:'N/A',notes:'Account ready for ranked. Change email first for security. Skins include: Xeno Hunter Knife, Mystbloom 2.0 Knife, Soulstrife Scythe, Evori Dreamwings Spellcaster Knife, Reaver Vandal, Gaia\'s Vandal, Xerofang Vandal, Exo Vandal, Mystbloom 2.0 Vandal, Mystbloom Sheriff, Singularity Sheriff, Minima Sheriff, and more coming soon.'}},
  {id:'lst_004',platform:'TikTok',username:'@ofwh',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_ofwh@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_ofwh@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_005',platform:'TikTok',username:'@nmxc',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_nmxc@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_nmxc@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_006',platform:'TikTok',username:'@xnyi',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_xnyi@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_xnyi@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_007',platform:'TikTok',username:'@5aww',price:10,description:'TikTok OGE Account',tag:'4C',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_5aww@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_5aww@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}},
  {id:'lst_008',platform:'TikTok',username:'@bnnx',price:10,description:'TikTok OGE Account',tag:'4L',available:true,accountStatus:'✓ OGE included • Ready for ownership',
   creds:{email:'tiktok_bnnx@gmail.com',password:'TikTok2024!',recoveryEmail:'backup_bnnx@gmail.com',phone:'N/A',notes:'Change email immediately after purchase.'}}
];
const DEF_CFG={
  cashapp:'$htqa',
  cryptoOptions:[
    {name:'Bitcoin',symbol:'BTC',addr:'bc1qeqgsckrgg9xytf6f02z7anpy8khl7lfp4yy7d3',logo:'₿'},
    {name:'Litecoin',symbol:'LTC',addr:'LdTtC1GtoiBguQcMPf7Fu7jpwKYHEqyENh',logo:'Ł'},
    {name:'Ethereum',symbol:'ETH',addr:'0xa94933309fEB1Ec1D392FecaE1C4EE6622b08a78',logo:'◆'}
  ],
  adminPw:'admin123'
};
const PC={Instagram:'#e1306c','X / Twitter':'#7eb8ff',TikTok:'#ff6b8a',YouTube:'#ff4444',Discord:'#7a8fff',Snapchat:'#ffdd57',Facebook:'#4f9bff',Reddit:'#ff7043',Twitch:'#a66bff',Valorant:'#ff4655',Roblox:'#e74c3c'};
const TC={'OG':'t-og','Premium':'t-prem','Niche':'t-niche','Legendary':'t-leg','Cutesy':'t-cutesy','4L':'t-4l','4C':'t-4c'};

function getListings(){const v=load('listings',null);if(!v||v.length<8||!v.some(l=>l.tag==='4C')){save('listings',SAMPLE_LISTINGS);return SAMPLE_LISTINGS}return v||SAMPLE_LISTINGS}
function getOrders(){return load('orders',[])}
function getCfg(){return load('cfg',DEF_CFG)}
function setTab(t){aTab=t;render()}
function aLogin(){const pw=document.getElementById('apw').value;if(pw===getCfg().adminPw){adminOk=true;render()}else{document.getElementById('aerr').innerHTML='<div style="color:var(--red);font-size:12px">Invalid password</div>'}}
function aLogout(){adminOk=false;aTab='orders';render()}
function appOrder(oid){const os=getOrders();const o=os.find(x=>x.id===oid);if(o){o.status='approved';save('orders',os);render()}}
function rejOrder(oid){const os=getOrders();const o=os.find(x=>x.id===oid);if(o){o.status='rejected';save('orders',os);render()}}
function delListing(lid){const ls=getListings();const l=ls.find(x=>x.id===lid);if(l){l.available=false;save('listings',ls);render()}}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function renderAOrders(orders,ls){
  if(!orders.length)return'<div class="empty">No orders yet.</div>';
  return[...orders].sort((a,b)=>{const r={pending:0,approved:1,rejected:2};return r[a.status]-r[b.status]||new Date(b.createdAt)-new Date(a.createdAt);})
    .map(o=>{
      const proof=o.payMethod==='cashapp'&&o.proofB64?`<button class="btn2" style="font-size:11px;padding:4px 11px;margin-top:8px">View Screenshot</button>`:
        o.payMethod==='crypto'&&o.txId?`<div style="font-size:11px;color:var(--text3);margin-top:7px;word-break:break-all">TX: <span style="font-family:var(--mono);color:var(--text2)">${esc(o.txId)}</span></div>`:'';
      const acts=o.status==='pending'?`<div style="display:flex;gap:8px;flex-shrink:0"><button class="btn-g" onclick="appOrder(${JSON.stringify(o.id)})">✓ Approve</button><button class="btn-r" onclick="rejOrder(${JSON.stringify(o.id)})">✗ Reject</button></div>`:`<span class="sbadge s-${o.status}">${o.status}</span>`;
      const l=ls.find(x=>x.id===o.listingId);
      const credHtml=o.status==='approved'&&l?.creds?`<hr><div style="font-size:11px;font-weight:700;color:var(--green);letter-spacing:1.2px;margin-bottom:8px">CREDENTIALS RELEASED</div><div class="cbox">${Object.entries(l.creds).filter(([,v])=>v&&v!=='N/A').map(([k,v])=>`<div class="crow"><span class="ckey">${cap(k)}</span><span class="cval">${esc(v)}</span></div>`).join('')}</div>`:'';
      return`<div class="card" style="padding:18px 20px;margin-bottom:10px">`+
        `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap">`+
        `<div style="flex:1;min-width:0">`+
        `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${esc(o.id)}</span><span class="sbadge s-${o.status}">${o.status}</span></div>`+
        `<div style="font-size:15px;font-weight:600;margin-bottom:3px">${esc(o.listingPlatform)} · <span style="font-family:var(--mono);color:var(--accent)">${esc(o.listingUsername)}</span> <span style="font-family:var(--head);font-size:13px;color:var(--gold)">$${(o.listingPrice||0).toLocaleString()}</span></div>`+
        `<div style="font-size:12px;color:var(--text2)">${esc(o.buyerName)} · ${esc(o.buyerEmail)} · ${o.payMethod==='cashapp'?'CashApp':'Crypto'}</div>`+
        `<div style="font-size:11px;color:var(--text3);margin-top:3px">${new Date(o.createdAt).toLocaleString()}</div>`+
        proof+`</div>${acts}</div>${credHtml}</div>`;
    }).join('');
}

function renderAListings(ls){
  const cards=ls.map(l=>{
    const pc=PC[l.platform]||'#8aa4d8';const tc=TC[l.tag]||'t-niche';
    return`<div class="card" style="padding:16px 18px;margin-bottom:9px">`+
      `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">`+
      `<div style="flex:1;min-width:0">`+
      `<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px"><span style="color:${pc};font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase">${esc(l.platform)}</span>${l.tag?`<span class="tag ${tc}">${esc(l.tag)}</span>`:''}${!l.available?'<span class="tag t-sold">Sold</span>':''}</div>`+
      `<div style="font-family:var(--mono);font-size:17px;font-weight:700;margin-bottom:3px">${esc(l.username)}</div>`+
      `<div style="font-size:12px;color:var(--text2);margin-bottom:4px">${esc(l.description)}</div>`+
      `<div style="font-size:13px;color:var(--accent2)">$${l.price.toLocaleString()}</div></div>`+
      `<button class="btn-r" onclick="delListing(${JSON.stringify(l.id)})" style="white-space:nowrap">${l.available?'Delete':'Restore'}</button></div></div>`;
  }).join('');
  return cards||'<div class="empty">No listings.</div>';
}

function renderASettings(){
  const cfg=getCfg();
  return`<div class="card" style="padding:20px">`+
    `<h3 style="margin-bottom:16px;color:#e4efff">Payment Settings</h3>`+
    `<div style="margin-bottom:16px"><label style="display:block;font-size:12px;color:var(--text3);margin-bottom:6px">CashApp Tag</label><input type="text" value="${esc(cfg.cashapp)}" onchange="const c=getCfg();c.cashapp=this.value;save('cfg',c)" style="width:100%"></div>`+
    `<div style="margin-bottom:16px"><h4 style="margin-bottom:10px">Crypto Addresses</h4>${cfg.cryptoOptions.map((co,i)=>`<div style="margin-bottom:12px"><label style="display:block;font-size:12px;color:var(--text3);margin-bottom:6px">${co.name} (${co.symbol})</label><input type="text" value="${esc(co.addr)}" onchange="const c=getCfg();c.cryptoOptions[${i}].addr=this.value;save('cfg',c)" style="width:100%;font-family:var(--mono);font-size:11px"></div>`).join('')}</div>`+
    `<div><label style="display:block;font-size:12px;color:var(--text3);margin-bottom:6px">Admin Password</label><input type="password" value="${esc(cfg.adminPw)}" onchange="const c=getCfg();c.adminPw=this.value;save('cfg',c)" style="width:100%"></div>`+
    `</div>`;
}

function render(){
  let html='';
  if(!adminOk){
    html=`<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center">`+
      `<div style="max-width:360px;background:rgba(5,9,28,0.95);border:1px solid rgba(182,156,255,.35);border-radius:18px;padding:40px 30px;box-shadow:0 20px 60px rgba(0,0,0,.8)">`+
      `<h2 style="font-family:var(--head);font-size:34px;font-weight:700;margin-bottom:8px;color:#e4efff">Admin Access</h2>`+
      `<p style="color:var(--text2);font-size:14px;margin-bottom:30px">Enter your password to manage listings, orders, and settings.</p>`+
      `<div style="margin-bottom:14px"><input type="password" id="apw" placeholder="Password" onkeydown="if(event.key==='Enter')aLogin()" style="width:100%"></div>`+
      `<button class="btn" onclick="aLogin()" style="width:100%;padding:12px">Sign In</button>`+
      `<p style="color:var(--text3);font-size:11px;margin-top:14px">Default: admin123</p>`+
      `<div id="aerr" style="margin-top:10px"></div></div></div>`;
  }else{
    const orders=getOrders(),ls=getListings();
    const pend=orders.filter(o=>o.status==='pending').length;
    let tc='';
    if(aTab==='orders')tc=renderAOrders(orders,ls);
    else if(aTab==='listings')tc=renderAListings(ls);
    else tc=renderASettings();
    html=`<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:999;overflow-y:auto;padding:30px 20px">`+
      `<div style="max-width:1000px;margin:0 auto;background:rgba(5,9,28,0.96);border:1px solid rgba(182,156,255,.35);border-radius:18px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.8)">`+
      `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;flex-wrap:wrap;gap:12px">`+
      `<div><h2 style="font-family:var(--head);font-size:28px;font-weight:700;color:#e4efff">Dashboard</h2>`+
      `<p style="color:var(--text3);font-size:13px">${ls.length} listings · ${orders.length} orders${pend?` · <span style="color:var(--gold)">${pend} pending</span>`:''}</p></div>`+
      `<button class="btn2" onclick="aLogout()" style="font-size:12px">Sign Out</button></div>`+
      `<div class="tabs">`+
      `<button class="tab${aTab==='orders'?' on':''}" onclick="setTab('orders')">Orders${pend?` <span style="background:var(--accent2);color:#1a1240;border-radius:100px;padding:1px 7px;font-size:10px;margin-left:4px;font-weight:700">${pend}</span>`:''}</button>`+
      `<button class="tab${aTab==='listings'?' on':''}" onclick="setTab('listings')">Listings</button>`+
      `<button class="tab${aTab==='settings'?' on':''}" onclick="setTab('settings')">Settings</button></div>`+
      `<div id="atc">${tc}</div></div></div>`;
  }
  document.getElementById('root').innerHTML=html;
}

render();
</script>
</body>
</html>
